name: ci-minio
on: workflow_dispatch

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    environment: build
    steps:

      - uses: actions/checkout@v4

      # qemu only runs the final stage's chmod for the non-native arch; the Go
      # builds cross-compile on the runner (see ci-minio/Dockerfile)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Print image name
        run: |
          echo ghcr.io/novelai/ci-minio-v2:${GITHUB_SHA::7}

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/novelai/ci-minio-v2:${GITHUB_SHA::7} \
            --push \
            ci-minio/.
